<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin — To’y taklifnomasi</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#2b2220;--mut:#8c7f76;--mar:#7a1f2b;--line:#e8dfd3;--ok:#1f7a45;--bad:#c4161c;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#161211;--card:#241d1b;--ink:#f1e7dd;--mut:#b2a597;--mar:#c0506a;--line:#3a302c;--ok:#4cc27f;--bad:#ff6b6f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:18px}
.w{max-width:760px;margin:0 auto}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--mar);color:#fff}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
a.b{display:inline-block;text-decoration:none;font-size:inherit;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.st b{display:block;font-size:1.5rem;color:var(--mar)}
.st span{font-size:.7rem;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bd{font-size:.78rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.m{color:var(--mut);font-size:.85rem}
.an{margin-top:8px;font-size:.88rem;border-top:1px dashed var(--line);padding-top:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.btns button,.btns a{font-size:.82rem;padding:7px 11px}
#msg{color:var(--bad);margin-top:8px;min-height:1.3em}
</style>
</head>
<body>
<div class="w">
 <div id="lg" class="card" style="max-width:380px;margin:12vh auto 0">
  <h1>Admin panel</h1>
  <p class="m">Parolni kiriting</p>
  <input id="pw" type="password" placeholder="Parol" autocomplete="current-password">
  <div id="msg"></div>
  <button id="go" style="width:100%">Kirish</button>
 </div>

 <div id="ap" hidden>
  <div class="row" style="margin-bottom:14px"><h1>💍 Mehmonlar</h1><div><button class="g" id="csv">CSV</button> <button class="g" id="out">Chiqish</button></div></div>
  <div class="st" id="st"></div>
  <div class="card">
   <div class="m" style="margin-bottom:8px">Mehmon qo’shish (har qatorga bitta ism)</div>
   <textarea id="names" rows="3" placeholder="Aziz aka&#10;Malika opa"></textarea>
   <div class="btns"><button id="add">Qo’shish</button></div>
  </div>
  <div id="list"></div>
 </div>
</div>
<script>
var P=sessionStorage.getItem("ap")||"",G=[],$=function(i){return document.getElementById(i)};
var QN=["Sovg’a"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
async function api(m,p,b){
  var r=await fetch("/api/admin/"+p,{method:m,headers:{"Content-Type":"application/json","x-admin-password":P},body:b?JSON.stringify(b):undefined});
  var j=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(j.error||"Xato");return j;
}
async function load(){
  try{G=(await api("GET","guests")).guests;$("lg").hidden=true;$("ap").hidden=false;draw()}
  catch(e){$("lg").hidden=false;$("ap").hidden=true;$("msg").textContent=P?e.message:""}
}
function status(g){
  if(g.status==="confirmed")return['<span class="bd ok">✅ Keladi</span>'];
    if(g.status==="started")return['<span class="bd">✍️ Savollarga javob bermoqda</span>'];
  if(g.opens>0)return['<span class="bd">👀 Ochdi</span>'];
  return['<span class="bd m">Hali ochmadi</span>'];
}
function link(g){return location.origin+"/?g="+g.id}
function ago(t){return t?new Date(t).toLocaleString("uz",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"—"}
function draw(){
  var n=G.length,o=G.filter(function(g){return g.opens>0}).length,c=G.filter(function(g){return g.status==="confirmed"}).length,r=G.filter(function(g){return g.status==="rejected"}).length;
  $("st").innerHTML=[["Jami",n],["Ochgan",o],["Keladi",c]].map(function(x){return"<div><b>"+x[1]+"</b><span>"+x[0]+"</span></div>"}).join("");
  $("list").innerHTML=G.slice().reverse().map(function(g){
    var an=[0].filter(function(i){return g.answers&&g.answers[i]}).map(function(i){return"<div><span class='m'>"+QN[i]+":</span> "+esc(g.answers[i])+"</div>"}).join("");
    var t=encodeURIComponent("Hurmatli "+g.name+", sizni to’yimizga taklif qilamiz 💍");
    return'<div class="card"><div class="row"><strong>'+esc(g.name)+'</strong>'+status(g)+'</div>'+
    '<div class="m">Ochgan: '+(g.opens||0)+' marta · oxirgi: '+ago(g.lastOpen)+'</div>'+
    (an?'<div class="an">'+an+'</div>':'')+
    '<div class="btns"><button data-c="'+g.id+'">🔗 Havolani nusxalash</button><a class="b" target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(link(g))+'&text='+t+'">Telegram</a><button class="g" data-d="'+g.id+'">O’chirish</button></div></div>';
  }).join("")||'<p class="m" style="text-align:center">Hali mehmon yo’q. Yuqoriga ism yozib qo’shing.</p>';
}
$("go").onclick=function(){P=$("pw").value;sessionStorage.setItem("ap",P);load()};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("out").onclick=function(){sessionStorage.removeItem("ap");P="";location.reload()};
$("add").onclick=async function(){
  var v=$("names").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  if(!v.length)return;
  try{await api("POST","guests",{names:v});$("names").value="";load()}catch(e){alert(e.message)}
};
$("list").onclick=async function(e){
  var c=e.target.getAttribute("data-c"),d=e.target.getAttribute("data-d");
  if(c){var g=G.find(function(x){return x.id===c}),u=link(g);
    try{await navigator.clipboard.writeText(u);e.target.textContent="Nusxalandi ✓"}catch(x){prompt("Havola:",u)}
    setTimeout(draw,1500)}
  if(d&&confirm("O’chirilsinmi?")){try{await api("DELETE","guests?id="+d);load()}catch(x){alert(x.message)}}
};
$("csv").onclick=function(){
  var q=function(s){return'"'+String(s==null?"":s).replace(/"/g,'""')+'"'};
  var rows=[["Ism","Holat","Ochgan","Sovg’a","Havola"]].concat(G.map(function(g){
    var a=g.answers||{};return[g.name,g.status,g.opens||0,a[0],link(g)]}));
  var b=new Blob(["\ufeff"+rows.map(function(r){return r.map(q).join(",")}).join("\n")],{type:"text/csv"});
  var l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="mehmonlar.csv";l.click();
};
if(P)load();
setInterval(function(){if(!$("ap").hidden)load()},20000);
</script>
</body>
</html>
